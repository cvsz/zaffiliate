name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Deterministic install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Unit and contract tests
        run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Reject tracked runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|secrets/|.*\.(pem|key|p12|pfx))$'; then
            echo 'Tracked runtime secret material detected' >&2
            exit 1
          fi
          if grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9_]{20,})' --exclude-dir=.git --exclude='*.md' .; then
            echo 'Potential secret material detected' >&2
            exit 1
          fi
      - name: Validate migration evidence files
        shell: bash
        run: |
          set -euo pipefail
          test -s EXEC-PLANNING.md
          test -s SECURITY.md
          test -s OPERATIONS.md
          test -s docs/migration/SOURCE-SNAPSHOT-LEDGER.json
          node -e "JSON.parse(require('fs').readFileSync('docs/migration/SOURCE-SNAPSHOT-LEDGER.json','utf8'))"
      - name: Generate deterministic release evidence
        env:
          RELEASE_CREATED_AT: '2026-08-22T00:00:00Z'
        run: npm run release:manifest
      - name: Verify release manifest digest
        working-directory: dist
        run: sha256sum -c release-manifest.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            dist/release-manifest.json
            dist/release-manifest.sha256
          if-no-files-found: error
          retention-days: 30

  validation-harnesses:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Deterministic install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Start local server
        run: node apps/api/src/server.js &
        env:
          NODE_ENV: test
          PORT: 8080
      - name: Wait for health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy" >&2
          exit 1
      - name: Load test
        run: node scripts/load-test.mjs --concurrency=2 --durationMs=1000 --target=http://127.0.0.1:8080
      - name: Soak test
        run: node scripts/soak-test.mjs --durationMs=2000 --sampleIntervalMs=500 --target=http://127.0.0.1:8080
      - name: Fault injection
        run: node scripts/fault-inject.mjs --scenario=all --durationMs=500
      - name: Backup restore drill
        run: node scripts/backup-restore-drill.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-evidence-${{ github.sha }}
          path: |
            dist/*-evidence.json
          if-no-files-found: ignore
          retention-days: 7

  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zaffiliate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zaffiliate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: zaffiliate_test
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply tenant schema and RLS migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/001_core_tenant_rls.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/002_workflow_outreach.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/003_billing_ai_analytics.sql
      - name: Create non-superuser application test role
        run: psql -v ON_ERROR_STOP=1 -f db/tests/bootstrap-role.sql
      - name: Execute core cross-tenant RLS assertions
        run: psql -v ON_ERROR_STOP=1 -f db/tests/rls.sql
      - name: Execute durable workflow and outbox assertions
        run: psql -v ON_ERROR_STOP=1 -f db/tests/durable-workflow.sql
      - name: Execute billing AI analytics assertions
        run: psql -v ON_ERROR_STOP=1 -f db/tests/billing-ai-analytics.sql

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --pull -t zaffiliate:${{ github.sha }} .
      - name: Assert non-root runtime user
        shell: bash
        run: |
          set -euo pipefail
          user="$(docker inspect zaffiliate:${{ github.sha }} --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
