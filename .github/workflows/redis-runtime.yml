name: Redis Runtime

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/events/**'
      - 'test/events-node-redis-runtime.test.js'
      - '.github/workflows/redis-runtime.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/events/**'
      - 'test/events-node-redis-runtime.test.js'
      - '.github/workflows/redis-runtime.yml'

permissions:
  contents: read

jobs:
  redis-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_INTEGRATION_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Deterministic install
        run: npm ci --ignore-scripts
      - name: Redis runtime contract
        run: node --test test/events-node-redis-runtime.test.js
