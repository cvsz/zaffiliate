name: Runtime Wiring Diagnostic

on:
  pull_request:
    paths:
      - 'apps/api/src/business-async.js'
      - 'apps/api/src/runtime-factory.js'
      - 'apps/api/src/server.js'
      - 'test/api-business-async.test.js'
      - 'test/runtime-factory.test.js'
      - '.github/workflows/runtime-wiring-diagnostic.yml'

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Deterministic install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Runtime factory
        run: node --test test/runtime-factory.test.js
      - name: Async business helpers
        run: node --test test/api-business-async.test.js
      - name: Existing business routes
        run: node --test test/api-business-routes.test.js
      - name: API baseline
        run: node --test test/api-baseline.test.js
      - name: API security ingress
        run: node --test test/api-security-ingress.test.js
      - name: Server contract
        run: node --test test/server.test.js
      - name: Multi-tenant golden E2E
        run: node --test test/multi-tenant-golden-e2e.test.js
      - name: OAuth flow
        run: node --test test/oauth-flow.test.js
      - name: E2E and TikTok review
        run: node --test test/e2e.test.js test/tiktok-app-review.test.js
