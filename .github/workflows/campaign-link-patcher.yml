name: Campaign Link Patcher

on:
  push:
    branches:
      - upgrade/zaff-campaign-lifecycle-parity-20260831
    paths:
      - '.github/workflows/campaign-link-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upgrade/zaff-campaign-lifecycle-parity-20260831
      - name: Patch affiliate link persistence atomically
        shell: python
        run: |
          from pathlib import Path
          p = Path('packages/db/src/affiliate-core-repo.js')
          s = p.read_text()

          old = """    productId: row.product_runtime_id,\n    destinationUrl: row.destination_url ?? row.url,"""
          new = """    productId: row.product_runtime_id,\n    campaignId: row.campaign_id ?? null,\n    destinationUrl: row.destination_url ?? row.url,"""
          assert s.count(old) == 1, 'mapLink patch target changed'
          s = s.replace(old, new)

          old = """      const offer = rows(offerResult)[0];\n      if (!offer) throw new Error(`offer ${input.offerId} not found`);\n      let destination;"""
          new = """      const offer = rows(offerResult)[0];\n      if (!offer) throw new Error(`offer ${input.offerId} not found`);\n      const campaignId = input.campaignId == null ? null : required(input.campaignId, 'campaignId').toLowerCase();\n      if (campaignId && !UUID_PATTERN.test(campaignId)) throw new Error('campaignId must be a UUID');\n      if (campaignId) {\n        const campaign = rows(await tx.query('SELECT id, status FROM campaigns WHERE tenant_id = $1 AND id = $2', [id, campaignId]))[0];\n        if (!campaign) throw new Error(`campaign ${campaignId} not found`);\n        if (campaign.status !== 'active') throw new Error(`campaign ${campaignId} must be active to generate links`);\n      }\n      let destination;"""
          assert s.count(old) == 1, 'generateLink campaign validation target changed'
          s = s.replace(old, new)

          old = """          `INSERT INTO affiliate_links (tenant_id, runtime_id, offer_id, url, destination_url, deep_link_url, sub_id, sub_ids, slug, expires_at, created_at)\n           VALUES ($1, $2, $3, $4, $5, $4, $6, $7::jsonb, $8, $9, $10)\n           RETURNING *, $11::text AS offer_runtime_id, $12::text AS product_runtime_id`,\n          [id, linkId, offer.id, deep.toString(), destination.toString(), Object.values(subIds)[0] ?? null, JSON.stringify(subIds), slug, expiresAt, occurredAt, offer.runtime_id, offer.product_runtime_id]"""
          new = """          `INSERT INTO affiliate_links (tenant_id, runtime_id, offer_id, campaign_id, url, destination_url, deep_link_url, sub_id, sub_ids, slug, expires_at, created_at)\n           VALUES ($1, $2, $3, $4, $5, $6, $5, $7, $8::jsonb, $9, $10, $11)\n           RETURNING *, $12::text AS offer_runtime_id, $13::text AS product_runtime_id`,\n          [id, linkId, offer.id, campaignId, deep.toString(), destination.toString(), Object.values(subIds)[0] ?? null, JSON.stringify(subIds), slug, expiresAt, occurredAt, offer.runtime_id, offer.product_runtime_id]"""
          assert s.count(old) == 1, 'generateLink insert target changed'
          s = s.replace(old, new)

          old = """      await enqueue(tx, id, 'link.generated', { linkId, offerId: offer.runtime_id }, occurredAt);"""
          new = """      await enqueue(tx, id, 'link.generated', { linkId, offerId: offer.runtime_id, ...(campaignId ? { campaignId } : {}) }, occurredAt);"""
          assert s.count(old) == 1, 'link event target changed'
          s = s.replace(old, new)
          p.write_text(s)
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/affiliate-core-repo.js
          git diff --cached --check
          git commit -m "feat(campaigns): persist campaign-scoped affiliate links"
          git push origin HEAD:upgrade/zaff-campaign-lifecycle-parity-20260831
