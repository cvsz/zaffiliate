name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run release:manifest
      - run: node scripts/generate-sbom.mjs
      - uses: docker/build-push-action@v5
        with:
          context: .
          tags: zaffiliate:${{ github.ref_name }}
          push: false
          load: true
      - run: docker inspect --format='{{.Config.User}}' zaffiliate:${{ github.ref_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/release-manifest.json
            dist/sbom.json
            dist/release-manifest.sha256
          retention-days: 90
    # GPG signing and deployment steps would be injected here.
    # Required secrets:
    #   GPG_PRIVATE_KEY: ASCII-armored private key
    #   GPG_PASSPHRASE: key passphrase
    #   GH_TOKEN: for signed push
    # Example:
    #   - run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
    #   - run: node scripts/gpg-attest.mjs --commit --key=${{ secrets.GPG_KEY_ID }} --push
    #   - run: gpg --detach-sign --armor dist/sbom.json
    #   - run: gpg --detach-sign --armor dist/release-manifest.json
