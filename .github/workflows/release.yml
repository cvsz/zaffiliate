name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run release:manifest
      - run: node scripts/generate-sbom.mjs
      - name: Release-candidate gate
        run: |
          set -e
          RC_OUT=$(node scripts/release-candidate.mjs "${{ github.ref_name }}")
          echo "$RC_OUT" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (!data.checksPassed) {
              console.error('release-candidate FAILED:');
              console.error(JSON.stringify(data.checks, null, 2));
              process.exit(1);
            }
            console.log('release-candidate OK');
          "
          test -f dist/rc-evidence.json
      - name: Upload rc-evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence
          path: dist/rc-evidence.json
          if-no-files-found: error
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v5
        with:
          context: .
          tags: |
            ghcr.io/cvsz/zaffiliate:${{ github.ref_name }}
            ghcr.io/cvsz/zaffiliate:latest
          push: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/release-manifest.json \
            dist/sbom.json \
            dist/release-manifest.sha256 \
            dist/rc-evidence.json \
            --title "zaffiliate ${{ github.ref_name }}" \
            --generate-notes
