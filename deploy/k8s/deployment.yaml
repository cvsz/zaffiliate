apiVersion: apps/v1
kind: Deployment
metadata:
  name: zaffiliate-api
  labels:
    app: zaffiliate-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zaffiliate-api
  template:
    metadata:
      labels:
        app: zaffiliate-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: ghcr.io/cvsz/zaffiliate:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: zaffiliate-env
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: zaffiliate-api
spec:
  selector: { app: zaffiliate-api }
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
